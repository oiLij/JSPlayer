name: Build JSPlayer TV (armeabi-v7a)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build armeabi-v7a Debug APK
        run: ./gradlew assembleLatestUniversalDebug -PabiFilter=armeabi-v7a

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: JSPlayer-armeabi-v7a
          path: app/build/outputs/apk/latestUniversal/debug/*.apk
